  </defs>
  <rect width="1200" height="627" fill="url(#paper)"/>
  <circle cx="1090" cy="-15" r="260" fill="#8F2F2A" opacity=".055"/>
  <circle cx="-55" cy="655" r="245" fill="#8F2F2A" opacity=".045"/>

