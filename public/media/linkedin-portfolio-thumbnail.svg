      <stop offset="1" stop-color="#371714"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#40231B" flood-opacity=".15"/>
